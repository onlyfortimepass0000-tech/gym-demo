<title>KILO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: fixed top role bar + scrolling content; cards in 12-col grid that collapses */
  :root {
    --bg: #0a0b0d;
    --surface: #121418;
    --surface-2: #181b21;
    --line: #23272f;
    --line-2: #2c313b;
    --fg: #f1f2f4;
    --fg-2: #a4a9b4;
    --fg-3: #6b7280;
    --accent: #d4ff3d;
    --accent-ink: #0a0b0d;
    --warm: #ff8a3d;
    --danger: #ff5c5c;
    --good: #58d68d;
    --radius: 14px;
    --radius-sm: 10px;
    --font-body: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-2: #f0f1f3;
      --line: #e5e7eb;
      --line-2: #d1d5db;
      --fg: #0a0b0d;
      --fg-2: #4b5159;
      --fg-3: #8b9099;
      --accent: #8fd600;
      --accent-ink: #0a0b0d;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f7f8; --surface: #ffffff; --surface-2: #f0f1f3; --line: #e5e7eb; --line-2: #d1d5db;
    --fg: #0a0b0d; --fg-2: #4b5159; --fg-3: #8b9099; --accent: #8fd600; color-scheme: light;
  }

  * { box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--fg); margin: 0; line-height: 1.5; font-feature-settings: "ss01","cv11"; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
  h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
  .mono { font-family: var(--font-mono); font-feature-settings: "tnum"; }
  .tabular { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: transparent; }
  button:focus-visible, [role="button"]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Top bar */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: rgba(10,11,13,0.82); backdrop-filter: saturate(140%) blur(14px); -webkit-backdrop-filter: saturate(140%) blur(14px);
    border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  .brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-weight: 700; font-size: 14px; }
  .brand-sub { color: var(--fg-3); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }

  .role-switch { margin-left: auto; display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; min-width: 0; overflow-x: auto; }
  .role-switch::-webkit-scrollbar { display: none; }
  .role-switch button { padding: 7px 13px; font-size: 13px; font-weight: 500; color: var(--fg-2); border-radius: 999px; white-space: nowrap; transition: color .15s, background .15s; }
  .role-switch button.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .role-switch button:hover:not(.active) { color: var(--fg); }

  /* Layout */
  .shell { max-width: 1240px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px max(16px, env(safe-area-inset-right, 0px)); }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .col-12 { grid-column: span 12; } .col-8 { grid-column: span 8; } .col-6 { grid-column: span 6; } .col-4 { grid-column: span 4; } .col-3 { grid-column: span 3; }
  @media (max-width: 860px) { .col-8, .col-6, .col-4, .col-3 { grid-column: span 12; } }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
  .card.pad-lg { padding: 28px; }
  .card.flat { background: transparent; border: 1px dashed var(--line-2); }
  .card.accent { background: linear-gradient(135deg, #d4ff3d 0%, #a8e01e 100%); color: var(--accent-ink); border-color: transparent; }
  .card.accent .muted, .card.accent .k { color: rgba(10,11,13,0.72); }

  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
  .k { font-size: 12px; color: var(--fg-2); font-weight: 500; }
  .muted { color: var(--fg-2); }
  .faint { color: var(--fg-3); }
  .divider { height: 1px; background: var(--line); margin: 14px 0; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .row-tight { display: flex; align-items: center; gap: 6px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stack-sm { display: flex; flex-direction: column; gap: 6px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .stack-lg { display: flex; flex-direction: column; gap: 16px; }

  .big { font-family: var(--font-display); font-size: clamp(28px, 5vw, 44px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .huge { font-family: var(--font-display); font-size: clamp(42px, 7vw, 68px); font-weight: 600; letter-spacing: -0.03em; line-height: 0.95; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); }
  .pill.good { color: var(--good); border-color: rgba(88, 214, 141, 0.3); background: rgba(88, 214, 141, 0.08); }
  .pill.warn { color: var(--warm); border-color: rgba(255, 138, 61, 0.3); background: rgba(255, 138, 61, 0.08); }
  .pill.danger { color: var(--danger); border-color: rgba(255, 92, 92, 0.3); background: rgba(255, 92, 92, 0.08); }
  .pill.accent { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--fg); transition: transform .08s, background .15s, border-color .15s; }
  .btn:hover { background: #22262e; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { background: #e5ff5a; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 7px 12px; font-size: 13px; }
  .btn.lg { padding: 16px 24px; font-size: 15px; }
  .btn.full { width: 100%; }

  /* Check-in hero */
  .checkin-hero { padding: 28px; border-radius: 18px; background: radial-gradient(circle at 20% 0%, rgba(212,255,61,0.18), transparent 55%), linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--line); }
  .checkin-hero.checked-in { background: radial-gradient(circle at 20% 0%, rgba(88,214,141,0.22), transparent 55%), linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); }

  /* Calendar heatmap */
  .heatmap { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .hm-cell { aspect-ratio: 1 / 1; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); position: relative; }
  .hm-cell.l1 { background: rgba(212,255,61,0.22); border-color: rgba(212,255,61,0.3); }
  .hm-cell.l2 { background: rgba(212,255,61,0.55); border-color: rgba(212,255,61,0.6); }
  .hm-cell.l3 { background: var(--accent); border-color: var(--accent); }
  .hm-cell.today { outline: 2px solid var(--fg); outline-offset: 1px; }
  .hm-legend { display: flex; align-items: center; gap: 6px; color: var(--fg-3); font-size: 11px; }
  .hm-swatch { width: 11px; height: 11px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }

  /* Progress bars */
  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .bar.warm > span { background: var(--warm); }
  .bar.danger > span { background: var(--danger); }
  .bar.good > span { background: var(--good); }

  /* Macro ring */
  .macro-ring { width: 108px; height: 108px; position: relative; flex-shrink: 0; }
  .macro-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .macro-ring .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }

  /* Exercise table */
  .ex-row { display: grid; grid-template-columns: 1fr 70px 70px 80px; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); align-items: center; }
  .ex-row + .ex-row { margin-top: 8px; }
  .ex-row .lbl { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .ex-head { display: grid; grid-template-columns: 1fr 70px 70px 80px; gap: 10px; padding: 0 14px; font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
  @media (max-width: 500px) {
    .ex-row { grid-template-columns: 1fr auto; }
    .ex-row > :nth-child(n+2) { grid-column: 2; justify-self: end; }
    .ex-head { display: none; }
  }

  /* Owner stat tiles */
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .tile .stat { font-family: var(--font-display); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-top: 8px; }
  .tile .delta { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .delta.up { color: var(--good); }
  .delta.dn { color: var(--danger); }

  /* Chart */
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding: 4px 0; }
  .bars .b { flex: 1; min-width: 0; background: linear-gradient(180deg, var(--accent) 0%, rgba(212,255,61,0.35) 100%); border-radius: 4px 4px 2px 2px; position: relative; min-height: 4px; }
  .bars .b.dim { background: var(--surface-2); border: 1px solid var(--line); }
  .bars-x { display: flex; gap: 6px; margin-top: 6px; }
  .bars-x span { flex: 1; text-align: center; font-size: 10px; color: var(--fg-3); }

  /* Members table */
  .table { width: 100%; border-collapse: collapse; min-width: 560px; }
  .table th, .table td { text-align: left; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
  .table tr:last-child td { border-bottom: 0; }
  .table tr:hover td { background: var(--surface-2); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); display: inline-grid; place-items: center; font-weight: 600; font-size: 12px; margin-right: 10px; color: var(--fg); border: 1px solid var(--line); vertical-align: middle; }
  .scroll-x { overflow-x: auto; margin: -4px; padding: 4px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(5,6,8,0.72); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal-bg[aria-hidden="false"] { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 28px; }
  .modal.wide { max-width: 560px; }

  /* Form */
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--fg); }
  .field .hint { font-size: 12px; color: var(--fg-3); }
  .input, select { width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); font: inherit; }
  .input:focus, select:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 10px 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s; }
  .chip.sel { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }

  /* QR */
  .qr { width: 220px; height: 220px; margin: 0 auto; background: #fff; border-radius: 12px; display: grid; place-items: center; padding: 12px; }
  .qr-grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(21, 1fr); gap: 0; }
  .qr-grid i { background: #0a0b0d; border-radius: 1px; }
  .qr-grid i.w { background: transparent; }

  /* misc */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .list .item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .meal { padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
  .meal h4 { font-size: 14px; font-family: var(--font-body); font-weight: 600; margin-bottom: 4px; }
  .meal .kcal { color: var(--fg-3); font-size: 12px; }

  .hidden { display: none !important; }
  .fade-in { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">K</div>
      <div class="stack-sm" style="gap:0;line-height:1;">
        <div>KILO</div>
        <div class="brand-sub">Thane West · Demo</div>
      </div>
    </div>
    <div class="role-switch" role="tablist" aria-label="Role">
      <button data-role="member" class="active">Member</button>
      <button data-role="beginner">Beginner</button>
      <button data-role="trainer">Trainer</button>
      <button data-role="owner">Owner</button>
    </div>
  </div>
</div>

<main class="shell" id="view"></main>

<!-- QR Modal -->
<div class="modal-bg" id="qrModal" aria-hidden="true" role="dialog" aria-label="QR check-in">
  <div class="modal">
    <div class="between" style="margin-bottom:16px;">
      <div>
        <div class="eyebrow">Scan at the door</div>
        <h2 style="font-size:22px;margin-top:4px;">Your check-in code</h2>
      </div>
      <button class="btn sm ghost" onclick="closeModal('qrModal')">Close</button>
    </div>
    <div class="qr"><div class="qr-grid" id="qrGrid"></div></div>
    <p class="muted" style="text-align:center;margin-top:16px;font-size:13px;">Point the camera at the gym tablet. Code refreshes every 2 min.</p>
    <button class="btn primary full" style="margin-top:14px;" onclick="simulateScan()">Simulate scan (demo)</button>
  </div>
</div>

<!-- Intake Modal -->
<div class="modal-bg" id="intakeModal" aria-hidden="true" role="dialog" aria-label="Plan intake">
  <div class="modal wide" id="intakeBody"></div>
</div>

<script>
/* ===========================================================
   State
   =========================================================== */
const DAY = 86400000;
const todayKey = () => new Date().toISOString().slice(0,10);

const DEFAULT_STATE = {
  role: 'member',
  member: {
    name: 'Aryan',
    streak: 11,
    checkedInToday: false,
    checkInTime: null,
    checkOutTime: null,
    // last 56 days of attendance (0,1,2,3) — seeded demo data
    history: seedHistory(),
    nutrition: null,  // {goal, weight, height, activity, diet, plan}
    beginner: null,   // {experience, days, focus, limits, equipment, plan}
  }
};

function seedHistory() {
  const h = [];
  for (let i = 55; i >= 0; i--) {
    const r = Math.random();
    let v = 0;
    if (r > 0.45) v = 1;
    if (r > 0.65) v = 2;
    if (r > 0.85) v = 3;
    // skip some sundays
    const d = new Date(Date.now() - i*DAY);
    if (d.getDay() === 0 && Math.random() > 0.3) v = 0;
    h.push(v);
  }
  return h;
}

let state = loadState();

function loadState() {
  try {
    const s = localStorage.getItem('kilo-state');
    if (s) return { ...DEFAULT_STATE, ...JSON.parse(s) };
  } catch(e) {}
  return structuredClone(DEFAULT_STATE);
}
function saveState() {
  try { localStorage.setItem('kilo-state', JSON.stringify(state)); } catch(e) {}
}

/* ===========================================================
   Routing
   =========================================================== */
const view = document.getElementById('view');
document.querySelectorAll('.role-switch button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.role-switch button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.role = b.dataset.role;
    saveState();
    render();
  });
});

function render() {
  view.classList.remove('fade-in');
  void view.offsetWidth;
  view.classList.add('fade-in');
  if (state.role === 'member') renderMember();
  else if (state.role === 'beginner') renderBeginner();
  else if (state.role === 'trainer') renderTrainer();
  else if (state.role === 'owner') renderOwner();
}

/* ===========================================================
   MEMBER VIEW
   =========================================================== */
function renderMember() {
  const m = state.member;
  view.innerHTML = `
    <div class="grid">
      <section class="col-8">
        <div class="checkin-hero ${m.checkedInToday ? 'checked-in' : ''}">
          <div class="row" style="justify-content:space-between;">
            <div>
              <div class="eyebrow">${new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' })}</div>
              <h1 style="font-size:clamp(28px,4vw,38px);margin-top:6px;">Welcome back, ${m.name}.</h1>
              <p class="muted" style="margin-top:4px;">${m.checkedInToday
                ? `Checked in at ${fmtTime(m.checkInTime)}. Session running.`
                : `Tap below to check in. The front desk sees it instantly.`}</p>
            </div>
            <div class="pill ${m.streak >= 7 ? 'accent' : ''}">🔥 <span class="tabular">${m.streak}</span>-day streak</div>
          </div>
          <div class="row" style="margin-top:24px;gap:10px;">
            ${m.checkedInToday
              ? `<button class="btn lg" onclick="checkOut()">Check out</button>
                 <div class="pill good"><span class="dot"></span> Inside the gym</div>`
              : `<button class="btn primary lg" onclick="checkIn()">Check in</button>
                 <button class="btn lg" onclick="openQR()">Scan QR at door</button>`}
          </div>
        </div>
      </section>

      <section class="col-4">
        <div class="card" style="height:100%;">
          <div class="eyebrow">This week</div>
          <div class="stack-lg" style="margin-top:12px;">
            <div>
              <div class="row between"><span class="k">Sessions</span><span class="tabular" style="font-weight:600;">${weeklyCount()}/5</span></div>
              <div class="bar" style="margin-top:6px;"><span style="width:${(weeklyCount()/5)*100}%"></span></div>
            </div>
            <div>
              <div class="row between"><span class="k">Avg session</span><span class="tabular" style="font-weight:600;">52 min</span></div>
              <div class="bar warm" style="margin-top:6px;"><span style="width:72%"></span></div>
            </div>
            <div>
              <div class="row between"><span class="k">Calories out</span><span class="tabular" style="font-weight:600;">2,480 kcal</span></div>
              <div class="bar good" style="margin-top:6px;"><span style="width:60%"></span></div>
            </div>
          </div>
        </div>
      </section>

      <section class="col-6">
        <div class="card">
          <div class="between" style="margin-bottom:14px;">
            <div>
              <div class="eyebrow">Attendance calendar</div>
              <h3 style="font-size:18px;margin-top:4px;">Last 8 weeks</h3>
            </div>
            <div class="hm-legend">
              Less <span class="hm-swatch"></span>
              <span class="hm-swatch" style="background:rgba(212,255,61,0.22);border-color:rgba(212,255,61,0.3);"></span>
              <span class="hm-swatch" style="background:rgba(212,255,61,0.55);border-color:rgba(212,255,61,0.6);"></span>
              <span class="hm-swatch" style="background:var(--accent);border-color:var(--accent);"></span>
              More
            </div>
          </div>
          <div class="heatmap">${renderHeatmap(m.history)}</div>
          <div class="divider"></div>
          <div class="row between">
            <span class="k">Total sessions · last 8 weeks</span>
            <span class="tabular" style="font-weight:600;">${m.history.filter(x=>x>0).length}</span>
          </div>
        </div>
      </section>

      <section class="col-6">
        ${renderNutritionCard()}
      </section>

      <section class="col-12">
        <div class="card">
          <div class="between" style="margin-bottom:14px;">
            <div>
              <div class="eyebrow">Today's workout</div>
              <h3 style="font-size:20px;margin-top:4px;">Push · chest, shoulders, triceps</h3>

      </div>
    `).join('')}
  `;
}

function renderHeatmap(history) {
  // 56 cells arranged into 8 weeks × 7 days. mark today.
  const todayIdx = history.length - 1;
  return history.map((v, i) => {
    const cls = ['', 'l1', 'l2', 'l3'][v] + (i === todayIdx ? ' today' : '');
    const d = new Date(Date.now() - (history.length - 1 - i) * DAY);
    const label = `${d.toLocaleDateString('en-IN', { day:'numeric', month:'short' })} · ${['rest','light','solid','intense'][v]}`;
    return `<div class="hm-cell ${cls}" title="${label}"></div>`;
  }).join('');
}

function macroRing({ p, c, f }) {
  const total = p * 4 + c * 4 + f * 9;
  const pp = (p * 4) / total, pc = (c * 4) / total, pf = (f * 9) / total;
  const C = 2 * Math.PI * 46;
  let o = 0;
  const seg = (color, frac) => {
    const len = frac * C;
    const s = `<circle cx="54" cy="54" r="46" fill="none" stroke="${color}" stroke-width="12" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-o}"/>`;
    o += len; return s;
  };
  return `<svg viewBox="0 0 108 108">
    <circle cx="54" cy="54" r="46" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
    ${seg('var(--accent)', pp)}${seg('var(--warm)', pc)}${seg('var(--good)', pf)}
  </svg>`;
}

  toast(`Checked out · ${mins} min session logged.`);
}
function simulateScan() {
  closeModal('qrModal');
  setTimeout(() => { checkIn(); toast('Scanned at the door. Welcome in.'); }, 300);
}
function switchRole(r) {
  document.querySelectorAll('.role-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.role === r);
  });

}

function openQR() {
  buildQR();
  openModal('qrModal');
}
function buildQR() {
  const grid = document.getElementById('qrGrid');
  const cells = [];
  // generate a deterministic-looking random pattern
  for (let i = 0; i < 441; i++) {
    const r = Math.sin(i * 7.3 + 42) * 10000;
    const on = (r - Math.floor(r)) > 0.5;
    cells.push(`<i class="${on?'':'w'}"></i>`);
  }
  // corner finders
  const stampFinder = (col, row) => {
    for (let dy = 0; dy < 7; dy++) for (let dx = 0; dx < 7; dx++) {
      const idx = (row + dy) * 21 + (col + dx);
      const edge = dx === 0 || dy === 0 || dx === 6 || dy === 6;
      const inner = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
      cells[idx] = `<i class="${edge || inner ? '' : 'w'}"></i>`;
    }
  };
  stampFinder(0, 0); stampFinder(14, 0); stampFinder(0, 14);
  grid.innerHTML = cells.join('');
}

/* ===========================================================
   Nutrition intake (5 questions)
   =========================================================== */
const NUTRITION_Q = [
  { k: 'goal', q: 'What\'s your main goal?', type: 'chips', options: ['Lose fat', 'Build muscle', 'Maintain', 'Get stronger'] },
  { k: 'diet', q: 'Any dietary preference?', type: 'chips', options: ['Vegetarian', 'Eggetarian', 'Non-veg', 'Vegan', 'Jain'] },
  { k: 'weight', q: 'Your current weight?', type: 'input', unit: 'kg', placeholder: '68' },
  { k: 'activity', q: 'How active are you outside the gym?', type: 'chips', options: ['Mostly sitting', 'Light walking', 'On my feet all day', 'Very active'] },
  { k: 'meals', q: 'How many meals do you prefer per day?', type: 'chips', options: ['3 meals', '4 meals', '5 meals', '6 meals'] },
];

function openNutritionIntake() {
  startIntake(NUTRITION_Q, 'Your nutrition plan', (answers) => {
    const plan = buildNutritionPlan(answers);
    state.member.nutrition = { ...answers, plan };
    saveState(); closeModal('intakeModal'); render();
    toast('Nutrition plan ready. Scroll down to see it.');
  });
}

function buildNutritionPlan(a) {
  const w = parseFloat(a.weight) || 68;
  const goalMap = { 'Lose fat': -300, 'Build muscle': 300, 'Maintain': 0, 'Get stronger': 200 };
  const actMap = { 'Mostly sitting': 28, 'Light walking': 32, 'On my feet all day': 36, 'Very active': 40 };
  const base = w * (actMap[a.activity] || 32);
  const kcal = Math.round((base + (goalMap[a.goal] || 0)) / 10) * 10;
  const pMult = a.goal === 'Build muscle' || a.goal === 'Get stronger' ? 2.0 : (a.goal === 'Lose fat' ? 2.2 : 1.6);
  const p = Math.round(w * pMult);
  const f = Math.round((kcal * 0.25) / 9);
  const c = Math.round((kcal - p*4 - f*9) / 4);
  const veg = a.diet === 'Vegetarian' || a.diet === 'Vegan' || a.diet === 'Jain';

  const title = `${a.goal} · ${a.diet}`;
  const meals = mealPlan(a, kcal, veg);
  return { title, kcal, macros: { p, c, f }, meals };
}

function mealPlan(a, kcal, veg) {
  const breakdown = { '3 meals':[0.3,0.4,0.3], '4 meals':[0.25,0.1,0.35,0.3], '5 meals':[0.22,0.1,0.28,0.1,0.3], '6 meals':[0.2,0.1,0.22,0.08,0.25,0.15] }[a.meals] || [0.3,0.4,0.3];
  const names = ['Breakfast','Mid-morning','Lunch','Evening snack','Dinner','Before bed'].slice(0, breakdown.length);
  const vegOptions = [
    'Oats with milk, banana, peanut butter, almonds.',
    'Greek yogurt with honey and seeds.',
    'Dal, roti, mixed sabzi, cucumber salad, curd.',
    'Fruit + handful of roasted chana.',
    'Paneer bhurji, 2 rotis, salad, bowl of dal.',
    'Warm milk with turmeric, 4 almonds.',
  ];
  const nonVegOptions = [
    '4-egg omelette, 2 slices whole-wheat toast, fruit.',
    'Whey shake with milk and a banana.',
    'Grilled chicken, brown rice, salad, curd.',
    'Boiled eggs + roasted peanuts.',
    'Fish curry, 2 rotis, sabzi, salad.',
    'Cottage cheese or casein shake.',
  ];
  const pool = veg ? vegOptions : nonVegOptions;
  return names.map((n, i) => ({
    name: n,
    kcal: Math.round(kcal * breakdown[i] / 10) * 10,
    items: pool[i] || 'Balanced plate: protein + complex carbs + vegetables.',
  }));
}

/* ===========================================================
   Beginner intake (5 questions)
   =========================================================== */
const BEGINNER_Q = [
  { k: 'experience', q: 'Have you lifted weights before?', type: 'chips', options: ['Never', 'Tried a few times', 'On and off', 'Returning after a break'] },
  { k: 'days', q: 'How many days a week can you train?', type: 'chips', options: ['2 days', '3 days', '4 days', '5 days'] },
  { k: 'focus', q: 'What matters most to you right now?', type: 'chips', options: ['Lose fat', 'Build muscle', 'Get stronger', 'Feel better / energy'] },
  { k: 'limits', q: 'Any injuries or things to be careful about?', type: 'chips', options: ['None', 'Lower back', 'Knee', 'Shoulder', 'Wrist'] },
  { k: 'equipment', q: 'What will you train with?', type: 'chips', options: ['Full gym', 'Dumbbells only', 'Home · bodyweight', 'Home · bands + DBs'] },
];

function openBeginnerIntake() {
  startIntake(BEGINNER_Q, 'Build your beginner plan', (answers) => {
    const plan = buildBeginnerPlan(answers);
    state.member.beginner = { ...answers, plan };
    saveState(); closeModal('intakeModal'); render();
    toast('Beginner plan ready. Week 1 is below.');
  });
}

function buildBeginnerPlan(a) {
  const days = parseInt(a.days) || 3;
  const title = `${a.focus} · ${days}-day start`;
  const note = `A safe first block. Form before weight, finish every set with 1–2 reps in reserve, breathe through every rep. You'll feel the pattern by week 2.`;

  const full = a.equipment === 'Full gym';
  const dbOnly = a.equipment === 'Dumbbells only';
  const home = a.equipment.startsWith('Home');

  const careKnee = a.limits === 'Knee';
  const careBack = a.limits === 'Lower back';
  const careSh = a.limits === 'Shoulder';

  // template days — pick based on days value
  const dayLib = {
    fullBody: {
      name: 'Full-body foundation',
      time: 45,
      tip: 'Add 1 rep per set each session before adding weight.',
      exercises: [
        { name: careBack ? 'Goblet squat (DB)' : (full ? 'Barbell back squat' : 'Goblet squat (DB)'), sets: 3, reps: '8–10', rest: '90s' },
        { name: home ? 'Push-up (incline)' : 'Dumbbell bench press', sets: 3, reps: '8–10', rest: '75s' },
        { name: full ? 'Lat pulldown' : 'One-arm DB row', sets: 3, reps: '10–12', rest: '60s' },
        { name: careSh ? 'Side-lying DB raise' : 'Seated DB shoulder press', sets: 3, reps: '10', rest: '60s' },
        { name: 'Plank', sets: 3, reps: '30–45s', rest: '45s' },
      ]
    },
    push: {
      name: 'Push · upper',
      time: 50,
      tip: 'Press straight up, not forward — elbows at 45°, not flared.',
      exercises: [
        { name: full ? 'Barbell bench press' : 'DB bench press', sets: 3, reps: '8–10', rest: '90s' },
        { name: careSh ? 'Landmine press' : 'Seated shoulder press', sets: 3, reps: '10', rest: '75s' },
        { name: 'Incline DB press', sets: 3, reps: '10–12', rest: '60s' },
        { name: 'Tricep rope pushdown', sets: 3, reps: '12', rest: '45s' },
        { name: 'Cable lateral raise', sets: 3, reps: '12–15', rest: '45s' },
      ]
    },
    pull: {
      name: 'Pull · back + biceps',
      time: 50,
      tip: 'Pull with your elbows, not your hands. Squeeze at the top for a second.',
      exercises: [
        { name: full ? 'Lat pulldown' : 'Assisted pull-up', sets: 3, reps: '8–10', rest: '90s' },
        { name: 'One-arm DB row', sets: 3, reps: '10 each', rest: '60s' },
        { name: full ? 'Seated cable row' : 'DB bent row', sets: 3, reps: '10–12', rest: '60s' },
        { name: 'Face pull', sets: 3, reps: '15', rest: '45s' },
        { name: 'DB hammer curl', sets: 3, reps: '12', rest: '45s' },
      ]
    },
    legs: {
      name: 'Legs + core',
      time: 55,
      tip: careKnee ? 'Stop just above parallel; strength first, depth later.' : 'Sit back into the heel. Knees track over toes, not inward.',
      exercises: [
        { name: careKnee ? 'Leg press (high foot)' : (full ? 'Barbell back squat' : 'Goblet squat'), sets: 4, reps: '8', rest: '2m' },
        { name: careBack ? 'Hip thrust' : 'Romanian deadlift', sets: 3, reps: '10', rest: '90s' },
        { name: 'Walking lunge', sets: 3, reps: '12 steps', rest: '60s' },
        { name: 'Standing calf raise', sets: 3, reps: '15', rest: '45s' },
        { name: 'Hanging knee raise', sets: 3, reps: '10–12', rest: '45s' },
      ]
    },
    conditioning: {
      name: 'Conditioning + core',
      time: 35,
      tip: 'Short, hard, and consistent beats long and sloppy. Warm up thoroughly.',
      exercises: [
        { name: 'Rowing machine', sets: 5, reps: '250m', rest: '60s' },
        { name: 'KB swing', sets: 4, reps: '12', rest: '45s' },
        { name: 'Dead bug', sets: 3, reps: '8 each', rest: '45s' },
        { name: 'Farmer carry', sets: 3, reps: '30s', rest: '60s' },
      ]
    },
  };

  const plans = {
    2: [dayLib.fullBody, dayLib.fullBody],
    3: [dayLib.fullBody, dayLib.conditioning, dayLib.fullBody],
    4: [dayLib.push, dayLib.pull, dayLib.legs, dayLib.conditioning],
    5: [dayLib.push, dayLib.pull, dayLib.legs, dayLib.fullBody, dayLib.conditioning],
  };

  return { title, note, days: plans[days] };
}

/* ===========================================================
   Intake runner
   =========================================================== */
let intakeState = null;
function startIntake(questions, title, onDone) {
  intakeState = { questions, title, idx: 0, answers: {}, onDone };
  openModal('intakeModal');
  renderIntake();
}
function renderIntake() {
  const s = intakeState;
  const q = s.questions[s.idx];
  const body = document.getElementById('intakeBody');
  const pct = ((s.idx) / s.questions.length) * 100;
  body.innerHTML = `
    <div class="between" style="margin-bottom:6px;">
      <div class="eyebrow">${s.title} · ${s.idx+1} of ${s.questions.length}</div>
      <button class="btn sm ghost" onclick="closeModal('intakeModal')">Cancel</button>
    </div>
    <div class="bar" style="margin-bottom:22px;"><span style="width:${pct}%"></span></div>
    <h2 style="font-size:22px;margin-bottom:18px;">${q.q}</h2>
    <div id="qSlot"></div>
    <div class="row between" style="margin-top:26px;">
      <button class="btn ghost" ${s.idx === 0 ? 'disabled style="opacity:.4;pointer-events:none;"' : ''} onclick="intakeBack()">← Back</button>
      <button class="btn primary" id="intakeNext" onclick="intakeNext()">${s.idx === s.questions.length - 1 ? 'Build my plan' : 'Next →'}</button>
    </div>
  `;
  const slot = document.getElementById('qSlot');
  if (q.type === 'chips') {
    slot.innerHTML = `<div class="chips">${q.options.map(o => `<div class="chip ${s.answers[q.k]===o?'sel':''}" data-val="${o}">${o}</div>`).join('')}</div>`;
    slot.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
      s.answers[q.k] = c.dataset.val;
      slot.querySelectorAll('.chip').forEach(x => x.classList.toggle('sel', x === c));
    }));
  } else {
    slot.innerHTML = `<div class="row-tight"><input class="input" id="qInput" type="text" inputmode="numeric" placeholder="${q.placeholder || ''}" value="${s.answers[q.k] || ''}"/><span class="muted mono">${q.unit || ''}</span></div>`;
    const inp = document.getElementById('qInput');
    inp.addEventListener('input', () => s.answers[q.k] = inp.value);
    inp.focus();
  }
}
function intakeNext() {
  const s = intakeState;
  const q = s.questions[s.idx];
  if (!s.answers[q.k]) { toast('Pick one to continue.'); return; }
  if (s.idx === s.questions.length - 1) { s.onDone(s.answers); return; }
  s.idx++; renderIntake();
}
function intakeBack() {
  if (intakeState.idx > 0) { intakeState.idx--; renderIntake(); }
}

/* ===========================================================
   Helpers
   =========================================================== */
function weeklyCount() {
  // last 7 entries
  const h = state.member.history.slice(-7);
  return h.filter(x => x > 0).length;
}
function fmtTime(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' });
}

let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line-2);color:var(--fg);padding:12px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,0.4);opacity:0;transition:opacity .2s;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => { el.style.opacity = '1'; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2600);
}

/* Initial render */
render();
</script>
